<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Nikhilesh Gawhale — Generative AI / ML Engineer">
  <defs>
    <radialGradient id="bg" cx="72%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1a0d08"/>
      <stop offset="0.45" stop-color="#08080d"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#ffd2a8"/>
      <stop offset="0.45" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4d00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050507" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="outline" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4d00"/>
      <stop offset="0.5" stop-color="#ffb37a"/>
      <stop offset="1" stop-color="#00e5a0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="64" y="318" height="34" width="0">
        <animate attributeName="width" values="0;0;650;650;0" keyTimes="0;0.08;0.55;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .flicker { animation: flicker 6s infinite; }
      @keyframes flicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
        20%, 24%, 55% { opacity: 0.35; }
      }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 930px 200px; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>

  <!-- perspective floor grid, vanishing point at the core -->
  <g stroke="#1f1f2e" stroke-width="1" opacity="0.9">
    <line x1="930" y1="300" x2="-300" y2="440"/><line x1="930" y1="300" x2="100" y2="440"/>
    <line x1="930" y1="300" x2="420" y2="440"/><line x1="930" y1="300" x2="680" y2="440"/>
    <line x1="930" y1="300" x2="930" y2="440"/><line x1="930" y1="300" x2="1180" y2="440"/>
    <line x1="930" y1="300" x2="1440" y2="440"/><line x1="930" y1="300" x2="1900" y2="440"/>
  </g>
  <g stroke="#1f1f2e" stroke-width="1">
    <line x1="0" y1="304" x2="1200" y2="304"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
    <line x1="0" y1="324" x2="1200" y2="324"/>
    <line x1="0" y1="342" x2="1200" y2="342"/>
    <line x1="0" y1="368" x2="1200" y2="368"/>
    <line x1="0" y1="404" x2="1200" y2="404"/>
  </g>
  <rect y="290" width="1200" height="150" fill="url(#floorFade)"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#00e5a0" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softglow)"/>

  <!-- sparkles -->
  <g fill="#00e5a0">
    <circle cx="640" cy="60" r="1.6" class="twinkle"/>
    <circle cx="720" cy="140" r="1.2" class="twinkle" style="animation-delay:-1s"/>
    <circle cx="1110" cy="80" r="1.8" class="twinkle" style="animation-delay:-2s"/>
    <circle cx="1060" cy="250" r="1.2" class="twinkle" style="animation-delay:-0.5s"/>
    <circle cx="790" cy="270" r="1.4" class="twinkle" style="animation-delay:-1.6s"/>
    <circle cx="560" cy="200" r="1.2" class="twinkle" style="animation-delay:-2.4s"/>
  </g>
  <g fill="#ff7a3d">
    <circle cx="1150" cy="170" r="1.4" class="twinkle" style="animation-delay:-0.8s"/>
    <circle cx="690" cy="40" r="1.2" class="twinkle" style="animation-delay:-2.2s"/>
    <circle cx="840" cy="70" r="1.3" class="twinkle" style="animation-delay:-1.3s"/>
  </g>

  <!-- ===== rotating neural core ===== -->
  <ellipse cx="930" cy="300" rx="120" ry="16" fill="none" stroke="#00e5a0" stroke-width="2" filter="url(#glow)" opacity="0.85"/>
  <ellipse cx="930" cy="306" rx="96" ry="12" fill="#0c0c13"/>
  <circle cx="930" cy="200" r="150" fill="url(#halo)"/>

  <g transform="translate(930 200)">
    <!-- floating bob -->
    <animateTransform attributeName="transform" type="translate" values="930 200;930 192;930 200" dur="4s" repeatCount="indefinite"/>

    <!-- spinning meridians (the 3D globe illusion) -->
    <g fill="none" stroke="#00e5a0" stroke-width="1.2" opacity="0.75" filter="url(#softglow)">
      <circle r="92"/>
      <ellipse rx="92" ry="92"><animate attributeName="rx" values="92;0;92" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></ellipse>
      <ellipse rx="92" ry="92"><animate attributeName="rx" values="92;0;92" dur="6s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></ellipse>
      <ellipse rx="92" ry="92"><animate attributeName="rx" values="92;0;92" dur="6s" begin="-3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></ellipse>
      <ellipse rx="92" ry="92"><animate attributeName="rx" values="92;0;92" dur="6s" begin="-4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></ellipse>
      <!-- latitudes -->
      <ellipse rx="92" ry="20"/>
      <ellipse cy="-46" rx="80" ry="17" opacity="0.7"/>
      <ellipse cy="46" rx="80" ry="17" opacity="0.7"/>
      <ellipse cy="-78" rx="48" ry="10" opacity="0.5"/>
      <ellipse cy="78" rx="48" ry="10" opacity="0.5"/>
    </g>

    <!-- inner energy core -->
    <g class="pulse" style="transform-origin:0 0">
      <circle r="34" fill="url(#core)" filter="url(#glow)"/>
    </g>

    <!-- data points orbiting on latitudes -->
    <g fill="#9dffe0" filter="url(#softglow)">
      <circle r="3.4"><animateMotion dur="6s" repeatCount="indefinite" path="M92,0 A92,20 0 1,1 -92,0 A92,20 0 1,1 92,0"/></circle>
      <circle r="3.4"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M92,0 A92,20 0 1,1 -92,0 A92,20 0 1,1 92,0"/></circle>
      <circle r="2.8"><animateMotion dur="6s" begin="-1s" repeatCount="indefinite" path="M80,-46 A80,17 0 1,1 -80,-46 A80,17 0 1,1 80,-46"/></circle>
      <circle r="2.8"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M80,-46 A80,17 0 1,1 -80,-46 A80,17 0 1,1 80,-46"/></circle>
      <circle r="2.8"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M80,46 A80,17 0 1,1 -80,46 A80,17 0 1,1 80,46"/></circle>
      <circle r="2.8"><animateMotion dur="6s" begin="-5s" repeatCount="indefinite" path="M80,46 A80,17 0 1,1 -80,46 A80,17 0 1,1 80,46"/></circle>
      <circle r="2.2"><animateMotion dur="6s" begin="-0.5s" repeatCount="indefinite" path="M48,-78 A48,10 0 1,1 -48,-78 A48,10 0 1,1 48,-78"/></circle>
      <circle r="2.2"><animateMotion dur="6s" begin="-3.5s" repeatCount="indefinite" path="M48,78 A48,10 0 1,1 -48,78 A48,10 0 1,1 48,78"/></circle>
    </g>

    <!-- tilted outer orbit with an orange satellite -->
    <g transform="rotate(-24)">
      <ellipse rx="140" ry="34" fill="none" stroke="#7c5cff" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.8"/>
      <circle r="5" fill="#ff7a3d" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" path="M140,0 A140,34 0 1,1 -140,0 A140,34 0 1,1 140,0"/></circle>
    </g>
  </g>

  <!-- ===== name ===== -->
  <text x="64" y="74" class="mono" font-size="14" letter-spacing="5" fill="#ff7a3d">GENERATIVE AI · ML ENGINEER</text>

  <g class="flicker">
    <text x="60" y="168" class="sans" font-size="92" font-weight="800" letter-spacing="1" fill="#ff5a1f" filter="url(#glow)">NIKHILESH</text>
  </g>
  <text x="62" y="252" class="sans" font-size="78" font-weight="800" letter-spacing="1" fill="none" stroke="url(#outline)" stroke-width="2">GAWHALE</text>

  <!-- typing terminal line -->
  <g clip-path="url(#typeClip)">
    <text x="64" y="342" class="mono" font-size="19" fill="#c9f5e8"><tspan fill="#00e5a0">&gt;</tspan> rag.answer(q) <tspan fill="#ff7a3d">→</tspan> grounded <tspan fill="#00e5a0">✓</tspan>  eval κ, not just accuracy</text>
  </g>
  <rect x="64" y="325" width="10" height="21" fill="#00e5a0" class="blink">
    <animate attributeName="x" values="64;64;700;700;64" keyTimes="0;0.08;0.55;0.92;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- CTA pill -->
  <g transform="translate(64 380)">
    <rect width="300" height="36" rx="18" fill="#ff4d00" fill-opacity="0.12" stroke="#ff4d00" stroke-opacity="0.7"/>
    <circle cx="20" cy="18" r="4" fill="#00e5a0"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="34" y="23" class="mono" font-size="13" letter-spacing="1.5" fill="#ffffff">ENTER MY 3D PORTFOLIO  ↗</text>
  </g>
  <text x="1136" y="420" class="mono" font-size="11" fill="#5a5a6a" text-anchor="end">RAG · LoRA · Agents · Evals</text>
</svg>
